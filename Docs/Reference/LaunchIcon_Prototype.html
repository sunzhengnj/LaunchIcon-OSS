<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%238ce8ff'/%3E%3Cstop offset='.52' stop-color='%238069ff'/%3E%3Cstop offset='1' stop-color='%23ef83d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 8v16h12' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>LaunchIcon — Interactive Prototype</title>
  <style>
    :root { --text: rgba(255,255,255,.96); --muted: rgba(235,240,255,.70); --line: rgba(255,255,255,.20); --glass: rgba(16,24,62,.25); --focus: #a9d8ff; --ease: cubic-bezier(.2,.8,.2,1); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07133d; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; color: var(--text); }
    button, input { font: inherit; }
    button { color: inherit; }
    .wallpaper { position: fixed; inset: -8%; overflow: hidden; background: linear-gradient(142deg, #030c35 0%, #122c83 36%, #653e9f 68%, #eea2c8 120%); transform: scale(1.08); }
    .wallpaper::before, .wallpaper::after { content: ""; position: absolute; border-radius: 999px; filter: blur(45px); opacity: .9; }
    .wallpaper::before { width: 65vw; height: 42vw; top: -14vw; left: -15vw; background: radial-gradient(circle at 55% 50%, #6f91ff, #17399b 44%, transparent 70%); }
    .wallpaper::after { width: 58vw; height: 38vw; right: -8vw; bottom: -14vw; background: radial-gradient(circle at 42% 45%, #fb9ccb, #6d52e5 43%, transparent 72%); }
    .mountains { position: fixed; inset: 42% -7% 0; opacity: .60; filter: blur(5px); background: linear-gradient(170deg, transparent 0 18%, rgba(8,18,77,.15) 18% 100%),
      radial-gradient(80% 55% at 10% 70%, #162a72 0 31%, transparent 32%), radial-gradient(72% 68% at 36% 78%, #152568 0 32%, transparent 33%), radial-gradient(75% 62% at 68% 74%, #213079 0 31%, transparent 32%), radial-gradient(65% 52% at 100% 82%, #0a1a58 0 30%, transparent 31%); }
    .veil { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(5,12,45,.15), rgba(5,12,45,.30)); backdrop-filter: blur(14px) saturate(118%); }
    .app { position: relative; width: 100%; height: 100%; min-height: 620px; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(28px, 6vh, 68px) clamp(26px, 6vw, 96px) clamp(24px, 5vh, 54px); transition: opacity 180ms var(--ease), transform 180ms var(--ease); }
    .app.is-closed { opacity: 0; transform: scale(.985); pointer-events: none; }
    .top { height: 74px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .brand { font-size: 18px; font-weight: 600; letter-spacing: -.03em; text-shadow: 0 1px 18px rgba(0,0,0,.22); user-select: none; }
    .brand-mark { display: inline-grid; place-items: center; width: 19px; height: 19px; margin-right: 7px; border-radius: 6px; vertical-align: -3px; background: linear-gradient(135deg,#8ce8ff,#8069ff 50%,#ef83d4); box-shadow: inset 0 1px 1px rgba(255,255,255,.55), 0 5px 16px rgba(32,88,255,.4); font-size: 12px; color: #fff; }
    .search { position: relative; width: min(510px, 88vw); height: 42px; border: 1px solid var(--line); border-radius: 22px; background: rgba(15,28,76,.24); box-shadow: inset 0 1px rgba(255,255,255,.10), 0 10px 30px rgba(0,0,0,.12); backdrop-filter: blur(18px); transition: background 150ms var(--ease), border 150ms var(--ease), box-shadow 150ms var(--ease); }
    .search:focus-within { border-color: rgba(194,231,255,.77); background: rgba(21,39,95,.42); box-shadow: 0 0 0 3px rgba(125,200,255,.17), inset 0 1px rgba(255,255,255,.12); }
    .search svg { position: absolute; left: 15px; top: 11px; width: 18px; height: 18px; opacity: .88; }
    .search input { width: 100%; height: 100%; padding: 0 42px 0 43px; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; letter-spacing: -.01em; }
    .search input::placeholder { color: rgba(232,239,255,.62); }
    .clear { position: absolute; right: 9px; top: 8px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 13px; background: rgba(255,255,255,.12); font-size: 17px; line-height: 24px; cursor: pointer; opacity: 0; transform: scale(.8); transition: 150ms var(--ease); }
    .search.has-query .clear { opacity: 1; transform: scale(1); }
    .clear:hover { background: rgba(255,255,255,.22); }
    .stage { min-height: 0; position: relative; display: grid; place-items: center; }
    .grid-wrap { width: min(960px, 88vw); transition: opacity 180ms var(--ease), filter 220ms var(--ease), transform 220ms var(--ease); }
    .grid { display: grid; grid-template-columns: repeat(7, minmax(78px, 1fr)); grid-auto-rows: clamp(89px, 12vh, 118px); column-gap: clamp(18px, 3.2vw, 45px); row-gap: clamp(9px, 1.8vh, 25px); align-items: center; }
    .tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; min-width: 0; padding: 3px 4px; border: 0; border-radius: 15px; background: transparent; cursor: pointer; user-select: none; transition: transform 180ms var(--ease), opacity 180ms var(--ease), filter 180ms var(--ease); }
    .tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
    .tile:hover .icon { transform: translateY(-2px) scale(1.035); filter: brightness(1.08); }
    .tile:active .icon, .tile.launching .icon { transform: translateY(1px) scale(.92); transition-duration: 85ms; }
    .tile.dragging { opacity: .36; transform: scale(.92); }
    .tile.drop-target .icon { box-shadow: 0 0 0 3px rgba(198,235,255,.94), 0 14px 30px rgba(5,12,53,.4); }
    .tile.folder-target .icon::after { content: "+"; display: grid; place-items: center; position: absolute; inset: -7px; border: 2px solid rgba(220,244,255,.94); border-radius: 27px; background: rgba(94,146,255,.28); font-size: 21px; font-weight: 300; box-shadow: 0 0 25px rgba(150,214,255,.72); }
    .icon { position: relative; width: clamp(58px, 5.4vw, 76px); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; border-radius: 22%; background: var(--icon-bg, linear-gradient(135deg,#3479ff,#5ed8ff)); box-shadow: inset 0 1px 1px rgba(255,255,255,.46), inset 0 -7px 16px rgba(0,0,0,.13), 0 10px 22px rgba(3,11,52,.31); transition: transform 180ms var(--ease), filter 180ms var(--ease), box-shadow 180ms var(--ease); }
    .icon::before { content: ""; position: absolute; width: 130%; height: 46%; top: -18%; left: -18%; transform: rotate(-24deg); background: linear-gradient(90deg,rgba(255,255,255,.38),transparent 66%); filter: blur(5px); }
    .icon svg { position: relative; z-index: 1; width: 58%; height: 58%; fill: none; stroke: rgba(255,255,255,.94); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 2px rgba(0,0,0,.18)); }
    .folder-icon { display: grid; grid-template-columns: repeat(2, 19px); grid-template-rows: repeat(2, 19px); gap: 4px; padding: 11px; align-content: center; justify-content: center; background: linear-gradient(135deg,rgba(174,205,255,.84),rgba(69,122,239,.88)); }
    .folder-icon span { border-radius: 5px; box-shadow: inset 0 1px rgba(255,255,255,.42); }
    .name { width: 100%; overflow: hidden; color: rgba(255,255,255,.96); font-size: 12px; font-weight: 500; line-height: 15px; letter-spacing: -.01em; text-align: center; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,.55); white-space: nowrap; }
    .empty { grid-column: 1 / -1; place-self: center; padding: 32px; color: var(--muted); text-align: center; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .empty strong { display: block; margin-bottom: 7px; color: var(--text); font-size: 17px; }
    .pager { min-height: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .dot { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: rgba(217,230,255,.42); box-shadow: 0 1px 2px rgba(0,0,0,.2); cursor: pointer; transition: 170ms var(--ease); }
    .dot[aria-current="true"] { width: 8px; height: 8px; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.68); }
    .dot:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .nav { position: absolute; top: 50%; z-index: 5; width: 46px; height: 46px; border: 1px solid rgba(255,255,255,.20); border-radius: 50%; background: rgba(20,31,81,.28); box-shadow: inset 0 1px rgba(255,255,255,.13), 0 8px 25px rgba(0,0,0,.16); backdrop-filter: blur(12px); cursor: pointer; opacity: 0; transform: translateY(-50%) scale(.9); transition: 180ms var(--ease); }
    .stage:hover .nav, .nav:focus-visible { opacity: 1; transform: translateY(-50%) scale(1); }
    .nav:disabled { opacity: 0 !important; pointer-events: none; }
    .nav:hover { background: rgba(51,73,148,.52); }
    .nav svg { width: 19px; height: 19px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .prev { left: max(-24px, -3vw); } .next { right: max(-24px, -3vw); }
    .hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); color: rgba(229,237,255,.61); font-size: 11px; letter-spacing: .015em; text-shadow: 0 1px 2px rgba(0,0,0,.26); opacity: .75; }
    .toast { position: fixed; left: 50%; bottom: 42px; z-index: 20; padding: 10px 15px; border: 1px solid rgba(255,255,255,.23); border-radius: 15px; background: rgba(18,29,75,.72); box-shadow: 0 14px 40px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.13); backdrop-filter: blur(18px); color: #fff; font-size: 13px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: 220ms var(--ease); }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .closed-screen { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: 180ms var(--ease); background: rgba(2,7,27,.34); backdrop-filter: blur(7px); }
    .closed-screen.show { opacity: 1; pointer-events: auto; }
    .reopen { padding: 12px 18px; border: 1px solid rgba(255,255,255,.26); border-radius: 14px; background: rgba(26,42,103,.55); box-shadow: inset 0 1px rgba(255,255,255,.16), 0 16px 45px rgba(0,0,0,.27); cursor: pointer; }
    .folder-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 34px; background: rgba(3,8,33,.28); opacity: 0; pointer-events: none; transition: opacity 220ms var(--ease); }
    .folder-backdrop.open { opacity: 1; pointer-events: auto; }
    .folder-backdrop.open ~ .app .grid-wrap { filter: blur(7px); opacity: .46; transform: scale(.965); pointer-events: none; }
    .folder-panel { width: min(760px, 90vw); max-height: min(640px, 78vh); overflow: auto; padding: 25px 32px 32px; border: 1px solid rgba(255,255,255,.22); border-radius: 28px; background: linear-gradient(135deg,rgba(78,105,183,.70),rgba(23,35,91,.78)); box-shadow: inset 0 1px rgba(255,255,255,.17), 0 30px 90px rgba(0,0,0,.44); backdrop-filter: blur(30px) saturate(130%); transform: scale(.92) translateY(12px); transition: transform 240ms var(--ease); }
    .folder-backdrop.open .folder-panel { transform: scale(1) translateY(0); }
    .folder-head { display: flex; align-items: center; justify-content: center; position: relative; min-height: 32px; margin-bottom: 25px; }
    .folder-title { max-width: 70%; overflow: hidden; border: 0; outline: 0; background: transparent; color: #fff; font-size: 20px; font-weight: 600; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .folder-title:focus { border-bottom: 1px solid rgba(255,255,255,.6); }
    .folder-close { position: absolute; right: -9px; top: -6px; width: 31px; height: 31px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.13); cursor: pointer; font-size: 20px; line-height: 28px; }
    .folder-close:hover { background: rgba(255,255,255,.24); }
    .folder-grid { display: grid; grid-template-columns: repeat(5, minmax(76px,1fr)); gap: 24px 34px; }
    @media (max-width: 760px) { .app { min-height: 520px; padding: 22px 22px 30px; } .top { height: 63px; gap: 10px; } .grid-wrap { width: 100%; } .grid { grid-template-columns: repeat(5,minmax(50px,1fr)); grid-auto-rows: 99px; column-gap: 11px; row-gap: 13px; } .tile:nth-child(n+26) { display: none; } .icon { width: 52px; } .name { font-size: 11px; } .nav { opacity: .76; } .prev { left: -13px; } .next { right: -13px; } .folder-panel { padding: 22px; } .folder-grid { grid-template-columns: repeat(4, minmax(60px, 1fr)); gap: 19px 17px; } .hint { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; } }
  </style>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div><div class="mountains" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div>
  <div class="folder-backdrop" id="folderBackdrop" aria-hidden="true"><section class="folder-panel" role="dialog" aria-modal="true" aria-labelledby="folderTitle"><header class="folder-head"><input class="folder-title" id="folderTitle" aria-label="文件夹名称"><button class="folder-close" id="folderClose" aria-label="关闭文件夹">×</button></header><div class="folder-grid" id="folderGrid"></div></section></div>
  <main class="app" id="app">
    <header class="top"><div class="brand"><span class="brand-mark">L</span>LaunchIcon</div><label class="search" id="searchBox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="m16 16 4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg><input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索应用"><button class="clear" id="clearSearch" type="button" aria-label="清除搜索">×</button></label></header>
    <section class="stage" aria-label="应用网格"><button class="nav prev" id="prev" aria-label="上一页"><svg viewBox="0 0 24 24"><path d="m14.5 5.5-6 6.5 6 6.5"></path></svg></button><div class="grid-wrap"><div class="grid" id="grid" role="list"></div></div><button class="nav next" id="next" aria-label="下一页"><svg viewBox="0 0 24 24"><path d="m9.5 5.5 6 6.5-6 6.5"></path></svg></button></section>
    <nav class="pager" id="pager" aria-label="应用页面"></nav><div class="hint">← → 翻页 · 拖拽整理 · Esc 返回</div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div><div class="closed-screen" id="closedScreen"><button class="reopen" id="reopen">重新打开 LaunchIcon</button></div>
  <script>
    const palettes = ['linear-gradient(135deg,#225eea,#5fd9ff)','linear-gradient(135deg,#7c44ef,#ef75db)','linear-gradient(135deg,#007e71,#42d7b4)','linear-gradient(135deg,#dd3c5a,#ffb65e)','linear-gradient(135deg,#293b87,#4b7bff)','linear-gradient(135deg,#006da7,#41d9d6)','linear-gradient(135deg,#a136b6,#f293bb)','linear-gradient(135deg,#39455d,#8999bd)'];
    const glyphs = ['spark','wave','orbit','layers','leaf','prism','pulse','frame','kite','sun','bloom','compass','tiles','flame','wind','gem'];
    const names = ['Nova','Flux','Pebble','Writee','Lensy','Thread','Glyph','Orbit','Tide','Canvas','Tablex','Beacon','Muse','Parcel','Sprout','Scope','Stack','Tempo','Pixel','Drift','Vela','Zest','Quill','Rover','Bloom','Cipher','Vista','Forge','Lumen','Kite','Echo','Maple','Breeze','Mosaic','Nimble','Aster','Ridge','Aqua','Chord','Mint','Sable','Lattice','Prism','Kora','Pico','Dawn','Wharf','Melo','Arbor','Slate','Tonic','Reef','Vivid','Doodle','Rally','Morrow','Cove','Sonic','Merit','Vista Pro','Glint','Orbit X','Canvas 2','Tidepool','Sprig','Vanta','Sora','Gridly','Quest','Folio'];
    const makeApp = (name, i) => ({ id: `app-${i}`, name, kind: 'app', glyph: glyphs[i % glyphs.length], palette: palettes[i % palettes.length] });
    const apps = names.map(makeApp);
    const folder = { id: 'folder-studio', name: 'Studio', kind: 'folder', members: [apps[3], apps[10], apps[16], apps[18]], palette: palettes[4] };
    const pages = [ [...apps.slice(0, 34), folder], apps.slice(34) ];
    const state = { page: 0, query: '', dragID: null, openFolder: null, toastTimer: null };
    const $ = id => document.getElementById(id);
    const grid = $('grid'), pager = $('pager'), input = $('searchInput'), searchBox = $('searchBox'), folderBackdrop = $('folderBackdrop'), folderGrid = $('folderGrid'), folderTitle = $('folderTitle');
    const svgFor = type => ({
      spark:'<path d="m12 2 1.8 7.9L22 12l-8.2 2.1L12 22l-1.8-7.9L2 12l8.2-2.1L12 2Z" fill="currentColor" stroke="none"/>',
      wave:'<path d="M3 15c3.5-7 6.5 7 10-1s5.5-6 8-4"/><path d="M3 19c3.5-5 7 5 10-1" opacity=".7"/>',
      orbit:'<circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="9" ry="4.1" transform="rotate(-30 12 12)"/>',
      layers:'<path d="m12 3 8.5 4.8L12 12.5 3.5 7.8 12 3Z" fill="currentColor" stroke="none"/><path d="m4.5 12 7.5 4.3 7.5-4.3M4.5 16.2l7.5 4.3 7.5-4.3"/>',
      leaf:'<path d="M19.8 3.8C11 4.2 5.2 8.3 5.2 14.2c0 3.4 2.3 5.8 5.8 5.8 5.9 0 9.4-7.1 8.8-16.2Z" fill="currentColor" stroke="none"/><path d="M4 21c3.5-4.5 7.2-7.5 12.5-10.5"/>',
      prism:'<path d="m12 3 8 15H4L12 3Z" fill="currentColor" stroke="none"/><path d="m12 3 2.2 15M12 3 9.6 18" stroke="#fff" opacity=".7"/>',
      pulse:'<path d="M3 12h3l2-6 4 12 2.4-7H21"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
      frame:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 8h8v8H8z" fill="currentColor" stroke="none"/>',
      kite:'<path d="m12 3 7 7-7 11L5 10l7-7Z" fill="currentColor" stroke="none"/><path d="m5 10 7 3 7-3M12 13v8"/>',
      sun:'<circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',
      bloom:'<path d="M12 20c-7-4.4-8.5-9.7-6-12.4 2.3-2.5 5.1-.3 6 2.3.9-2.6 3.7-4.8 6-2.3 2.5 2.7 1 8-6 12.4Z" fill="currentColor" stroke="none"/>',
      compass:'<circle cx="12" cy="12" r="8.5"/><path d="m15.7 8.3-2.2 5.2-5.2 2.2 2.2-5.2 5.2-2.2Z" fill="currentColor" stroke="none"/>',
      tiles:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5" fill="currentColor" stroke="none"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" fill="currentColor" stroke="none"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" fill="currentColor" stroke="none"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" fill="currentColor" stroke="none"/>',
      flame:'<path d="M13.3 2.7c.6 4.4-3.4 5.5-2.5 9 .7-1 1.4-1.7 2.7-2.4 3.5 2 4.5 5 3.4 8.1-1 2.7-3.3 4.5-5.8 4.5-3.8 0-6.3-2.8-5.8-6.6.4-3.2 2.9-5.6 5.1-7.5.8-.7 1.8-2.2 3-5.1Z" fill="currentColor" stroke="none"/>',
      wind:'<path d="M3 8h11c3 0 3-4 0-4-1.5 0-2.4.8-2.8 1.8M3 12h17c2.3 0 2.3 4 0 4h-3M3 16h8c2.3 0 2.3 4 0 4H9"/>',
      gem:'<path d="m12 3 8 8-8 10L4 11l8-8Z" fill="currentColor" stroke="none"/><path d="m4 11h16M12 3v18" stroke="#fff" opacity=".7"/>'
    }[type]);
    const tileHTML = item => item.kind === 'folder' ? `<button class="tile folder" role="listitem" data-id="${item.id}" type="button" aria-label="打开文件夹 ${item.name}"><span class="icon folder-icon" style="--icon-bg:${item.palette}">${Array.from({length:4},(_,i)=>`<span style="background:${item.members[i % item.members.length].palette}"></span>`).join('')}</span><span class="name">${item.name}</span></button>` : `<button class="tile" role="listitem" draggable="true" data-id="${item.id}" type="button" aria-label="启动 ${item.name}"><span class="icon" style="--icon-bg:${item.palette}"><svg viewBox="0 0 24 24" aria-hidden="true">${svgFor(item.glyph)}</svg></span><span class="name">${item.name}</span></button>`;
    const getAll = () => [...pages.flat(), ...pages.flat().filter(x=>x.kind==='folder').flatMap(x=>x.members)];
    const showToast = text => { const t = $('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(state.toastTimer); state.toastTimer = setTimeout(()=>t.classList.remove('show'), 1900); };
    const normalize = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    function render() { const query = normalize(state.query.trim()); const entries = query ? getAll().filter(x => normalize(x.name).includes(query)) : pages[state.page]; grid.innerHTML = entries.length ? entries.map(tileHTML).join('') : '<div class="empty"><strong>未找到匹配的应用</strong>按 Esc 或清除按钮返回全部应用</div>'; searchBox.classList.toggle('has-query', Boolean(state.query)); pager.hidden = Boolean(query); $('prev').disabled = Boolean(query) || state.page === 0; $('next').disabled = Boolean(query) || state.page === pages.length - 1; pager.innerHTML = query ? '' : pages.map((_,i)=>`<button class="dot" type="button" data-page="${i}" aria-label="第 ${i+1} 页" aria-current="${i===state.page}"></button>`).join(''); bindTiles(); }
    function bindTiles() { grid.querySelectorAll('.tile').forEach(tile => { tile.addEventListener('click', () => { const item = findItem(tile.dataset.id); if (!item) return; if (item.kind === 'folder') openFolder(item); else launch(tile, item); }); tile.addEventListener('dragstart', event => { if (state.query) { event.preventDefault(); showToast('搜索时不能整理'); return; } state.dragID = tile.dataset.id; tile.classList.add('dragging'); event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', state.dragID); }); tile.addEventListener('dragend', () => { state.dragID = null; grid.querySelectorAll('.tile').forEach(x=>x.classList.remove('dragging','drop-target','folder-target')); }); tile.addEventListener('dragover', event => { if (!state.dragID || state.dragID === tile.dataset.id) return; event.preventDefault(); const r=tile.getBoundingClientRect(), inCenter=Math.abs(event.clientX-(r.left+r.width/2))<r.width*.28 && Math.abs(event.clientY-(r.top+r.height/2))<r.height*.28; tile.classList.toggle('folder-target', inCenter); tile.classList.toggle('drop-target', !inCenter); event.dataTransfer.dropEffect='move'; }); tile.addEventListener('dragleave', ()=>tile.classList.remove('drop-target','folder-target')); tile.addEventListener('drop', event => { event.preventDefault(); const sourceID=event.dataTransfer.getData('text/plain'), targetID=tile.dataset.id; if (!sourceID || sourceID===targetID) return; const r=tile.getBoundingClientRect(), center=Math.abs(event.clientX-(r.left+r.width/2))<r.width*.28 && Math.abs(event.clientY-(r.top+r.height/2))<r.height*.28; drop(sourceID,targetID,center); }); }); }
    function findItem(id) { return pages.flat().find(x=>x.id===id) || pages.flat().filter(x=>x.kind==='folder').flatMap(x=>x.members).find(x=>x.id===id); }
    function launch(tile, item) { tile.classList.add('launching'); setTimeout(()=>tile.classList.remove('launching'), 150); showToast(`已请求启动 ${item.name}（原型演示）`); }
    function drop(sourceID,targetID,center) { const current=pages[state.page], si=current.findIndex(x=>x.id===sourceID), ti=current.findIndex(x=>x.id===targetID); if (si<0 || ti<0) return; const source=current[si], target=current[ti]; if (center && target.kind==='folder') { if (target.members.length >= 25) return showToast('文件夹最多容纳 25 个应用'); target.members.push(source); current.splice(si,1); showToast(`已加入 ${target.name}`); } else if (center && target.kind==='app') { const members=[target,source]; const newFolder={id:`folder-${Date.now()}`,name:'新建文件夹',kind:'folder',members,palette:palettes[(si+ti)%palettes.length]}; const targetIndex=current.findIndex(x=>x.id===targetID); current.splice(Math.max(si,ti),1); current.splice(Math.min(si,ti),1,newFolder); showToast('已创建文件夹'); } else { current.splice(si,1); const targetIndex=current.findIndex(x=>x.id===targetID); current.splice(targetIndex+(si<targetIndex?1:0),0,source); showToast('已重新排列'); } render(); }
    function openFolder(folder) { state.openFolder=folder; folderTitle.value=folder.name; folderGrid.innerHTML=folder.members.map(tileHTML).join(''); folderGrid.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>launch(t, findItem(t.dataset.id)))); folderBackdrop.classList.add('open'); folderBackdrop.setAttribute('aria-hidden','false'); setTimeout(()=>$('folderClose').focus(), 80); }
    function closeFolder() { if (!state.openFolder) return false; state.openFolder.name=folderTitle.value.trim() || '未命名文件夹'; state.openFolder=null; folderBackdrop.classList.remove('open'); folderBackdrop.setAttribute('aria-hidden','true'); render(); return true; }
    function page(delta) { if (state.query) return; const next=Math.max(0,Math.min(pages.length-1,state.page+delta)); if (next===state.page) return; state.page=next; grid.animate([{transform:`translateX(${delta>0?0:-18}px)`,opacity:.32},{transform:'translateX(0)',opacity:1}],{duration:280,easing:'cubic-bezier(.2,.8,.2,1)'}); render(); }
    input.addEventListener('input',()=>{state.query=input.value; render();}); $('clearSearch').addEventListener('click',()=>{input.value='';state.query='';render();input.focus();}); $('prev').addEventListener('click',()=>page(-1)); $('next').addEventListener('click',()=>page(1)); pager.addEventListener('click',e=>{const d=e.target.closest('.dot');if(d){state.page=Number(d.dataset.page);render();}}); $('folderClose').addEventListener('click',closeFolder); folderBackdrop.addEventListener('click',e=>{if(e.target===folderBackdrop)closeFolder();}); $('reopen').addEventListener('click',()=>{$('app').classList.remove('is-closed');$('closedScreen').classList.remove('show');});
    document.addEventListener('keydown',e=>{ if ((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'){e.preventDefault();input.focus();return;} if(e.key==='Escape'){ if(closeFolder()) return; if(state.query){input.value='';state.query='';render();input.blur();return;} $('app').classList.add('is-closed');$('closedScreen').classList.add('show');return;} if(e.key==='ArrowLeft'&&!state.openFolder) page(-1); if(e.key==='ArrowRight'&&!state.openFolder) page(1); if(!state.openFolder && !e.metaKey && !e.ctrlKey && !e.altKey && e.key.length===1 && document.activeElement!==input){input.focus();input.value+=e.key;state.query=input.value;render();} });
    let wheelLock=false; document.querySelector('.stage').addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>40&&!wheelLock&&!state.query){wheelLock=true;page(e.deltaX>0?1:-1);setTimeout(()=>wheelLock=false,320);}}); render();
  </script>
</body>
</html>
