name: macOS validation

# Runs Core tests, channel Release analyze, and UI target compile.
# Does NOT launch the app or UI Runner; a green job is not a full UI pass.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Core, channel analysis, and UI target compile
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record toolchain
        run: xcodebuild -version

      - name: Ensure ripgrep is available
        run: command -v rg >/dev/null || brew install ripgrep

      - name: Guard against explicit network APIs
        run: ./script/check_no_network_apis.sh

      - name: Run Core tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: ./script/test_core.sh

      - name: Analyze Direct Release target
        run: >-
          xcodebuild -quiet -project LaunchIcon.xcodeproj
          -scheme LaunchIconDirect -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData/Direct"
          CODE_SIGNING_ALLOWED=NO analyze

      - name: Analyze Store spike Release target
        run: >-
          xcodebuild -quiet -project LaunchIcon.xcodeproj
          -scheme LaunchIconStoreSpike -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData/StoreSpike"
          CODE_SIGNING_ALLOWED=NO analyze

      - name: Compile UI test target without running UI Runner
        run: >-
          xcodebuild -quiet -project LaunchIcon.xcodeproj
          -scheme LaunchIconUITests -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DerivedData/UITests"
          CODE_SIGNING_ALLOWED=NO build-for-testing
